name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Stats
        run: |
          curl --fail --retry 3 --retry-delay 5 -H "Accept: image/svg+xml" -o stats.svg "https://github-readme-stats.vercel.app/api?username=angelo-marques&show_icons=true&theme=radical" || echo "Stats service unavailable"
          curl --fail --retry 3 --retry-delay 5 -H "Accept: image/svg+xml" -o langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=angelo-marques&layout=compact&theme=radical" || echo "Langs service unavailable"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          if grep -q "<svg" stats.svg; then git add stats.svg; fi
          if grep -q "<svg" langs.svg; then git add langs.svg; fi
          git commit -m "Update stats" || echo "No valid changes to commit"
          git push origin main
