name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # garante que está no branch principal

      - name: Generate Stats
        run: |
          curl -o stats.svg "https://github-readme-stats.vercel.app/api?username=angelo-marques&show_icons=true&theme=radical"
          curl -o langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=angelo-marques&layout=compact&theme=radical"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add stats.svg langs.svg
          git commit -m "Update stats" || echo "No changes to commit"
          git push origin main
